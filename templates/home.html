<!DOCTYPE html>
<html>
<head>
    <title>Profiles</title>
</head>
<body>

    <h1>All People</h1>

    <ul>
        {% for person in people %}

                <a href="/profile/{{ person.name }}">
                    {{ person.name }}
                </a>
            </li>
        {% endfor %}
    </ul>

</body>
</html>
