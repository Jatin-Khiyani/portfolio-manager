<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
        }

        h1 {
            margin-bottom: 5px;
        }

        .email {
            color: gray;
            margin-bottom: 30px;
        }

        .section {
            margin-top: 30px;
        }

        .section h2 {
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
        }

        .card {
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <!-- Name -->
    <h1>{{ person.name }}</h1>

    <!-- Email -->
    <div class="email">{{ person.email }}</div>

    <!-- Education -->
    <div class="section">
        <h2>Education</h2>
        <div class="card">
            <p>{{ person.education }}</p>
        </div>
    </div>

    <!-- Experience -->
    <div class="section">
        <h2>Experience</h2>
        <div class="card">
            <p>{{ person.experience }}</p>
        </div>
    </div>

    <!-- Projects -->
    <div class="section">
        <h2>Projects</h2>
        <div class="card">
            <p>{{ person.projects }}</p>
        </div>
    </div>

</body>

</html>
