<!DOCTYPE html>
<html>
<head>
    <title>Sign In</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #ffecb4;
            color: #5a3d2b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            width: 90%;
            max-width: 760px;
            text-align: center;
            padding: 45px 30px;
        }

        .card {
            background-color: #ffecb4;
            border: 3px solid #5a3d2b;
            border-radius: 24px;
            padding: 45px 35px;
            box-shadow: 10px 10px 0 #e5771e;
        }

        h1 {
            font-size: 46px;
            margin: 0;
            color: #5a3d2b;
        }

        .cheeky-line {
            font-size: 16px;
            margin-top: 12px;
            color: #e5771e;
            font-style: italic;
        }

        form {
            margin-top: 35px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            border: 2px solid #5a3d2b;
            border-radius: 12px;
            font-size: 16px;
            background-color: #fff7d8;
            color: #5a3d2b;
        }

        button {
            margin-top: 15px;
            background-color: #75c8ae;
            color: #5a3d2b;
            padding: 14px 38px;
            border-radius: 14px;
            border: 3px solid #5a3d2b;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 6px 6px 0 #e5771e;
            transition: 0.2s ease;
        }

        button:hover {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 #e5771e;
        }

        .error {
            margin-top: 22px;
            color: #e5771e;
            font-weight: bold;
        }

        .small-link {
            display: block;
            margin-top: 24px;
            color: #5a3d2b;
            font-size: 15px;
        }

        .small-link a {
            color: #e5771e;
            font-weight: bold;
            text-decoration: none;
        }

        .popup-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(90, 61, 43, 0.45);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .popup {
            width: 90%;
            max-width: 620px;
            background-color: #e5771e;
            color: #5a3d2b;
            border: 4px solid #5a3d2b;
            border-radius: 28px;
            padding: 42px 36px;
            text-align: center;
            box-shadow: 12px 12px 0 #5a3d2b;
        }

        .popup h2 {
            font-size: 34px;
            margin: 0;
            color: #5a3d2b;
        }

        .popup p {
            margin-top: 14px;
            font-size: 17px;
            color: #ffecb4;
            font-style: italic;
        }

        .popup-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 34px;
            flex-wrap: wrap;
        }

        .popup-button {
            text-decoration: none;
            background-color: #75c8ae;
            color: #5a3d2b;
            padding: 15px 30px;
            border-radius: 14px;
            border: 3px solid #5a3d2b;
            font-size: 17px;
            font-weight: bold;
            box-shadow: 6px 6px 0 #ffecb4;
            transition: 0.2s ease;
        }

        .popup-button:hover {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 #ffecb4;
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 36px;
            }

            .card {
                padding: 35px 24px;
            }

            .popup h2 {
                font-size: 28px;
            }

            .popup-button {
                width: 210px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="card">
            <h1>Welcome Back</h1>

            <p class="cheeky-line">
                Your generic resume is waiting for you.
            </p>

            <form action="/sign-in" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="user_name" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit">Sign In</button>
            </form>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

            <p class="small-link">
                Do not have an account?
                <a href="/sign-up">Create one</a>
            </p>
        </section>
    </main>

    {% if success %}
        <div class="popup-background">
            <section class="popup">
                <h2>Do you want to edit your portfolio?</h2>

                <p>
                    Welcome back, {{ name }}. Your resume machine is still alive.
                </p>

                <div class="popup-buttons">
                    <a class="popup-button" href="/create-portfolio">
                        Edit My Portfolio
                    </a>

                    <a class="popup-button" href="/portfolio">
                        View My Portfolio
                    </a>
                </div>
            </section>
        </div>
    {% endif %}
</body>
</html>
