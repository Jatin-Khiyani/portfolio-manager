<!DOCTYPE html>
<html>
<head>
    <title>Portfolio Manager</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #ffecb4;
            color: #5a3d2b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            width: 90%;
            max-width: 900px;
            text-align: center;
            padding: 50px 30px;
        }

        .badge {
            display: inline-block;
            background-color: #75c8ae;
            color: #5a3d2b;
            padding: 8px 18px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 52px;
            line-height: 1.05;
            margin: 0;
            color: #5a3d2b;
        }

        .cheeky-line {
            font-size: 17px;
            margin-top: 14px;
            color: #e5771e;
            font-style: italic;
        }

        .intro {
            max-width: 620px;
            margin: 32px auto 0;
            font-size: 19px;
            line-height: 1.6;
            color: #5a3d2b;
        }

        .buttons {
            margin-top: 42px;
            display: flex;
            justify-content: center;
            gap: 18px;
            flex-wrap: wrap;
        }

        .button {
            text-decoration: none;
            background-color: #75c8ae;
            color: #5a3d2b;
            padding: 15px 36px;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            border: 3px solid #5a3d2b;
            box-shadow: 6px 6px 0 #e5771e;
            transition: 0.2s ease;
        }

        .button:hover {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 #e5771e;
        }

        .retro-line {
            width: 130px;
            height: 8px;
            background-color: #f4a127;
            margin: 38px auto 0;
            border-radius: 999px;
        }

        @media (max-width: 700px) {
            h1 {
                font-size: 38px;
            }

            .intro {
                font-size: 17px;
            }

            .button {
                width: 180px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <div class="badge">Portfolio Manager</div>

        <h1>Ready to Make Your Resume in a Professional Format?</h1>

        <p class="cheeky-line">
            You may not get hired using this resume, but it is worth a try.
        </p>

        <p class="intro">
            This website helps you create a minimal one-page portfolio. Just enter your details and you will have your portfolio ready in no time.
        </p>

        <div class="buttons">
            <a class="button" href="sign-up">Sign Up</a>
            <a class="button" href="sign-in">Sign In</a>
        </div>

        <div class="retro-line"></div>
    </main>
</body>
</html>
