<!DOCTYPE html>
<html>
<head>
    <title>Create Portfolio</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #ffecb4;
            color: #5a3d2b;
        }

        .page {
            width: 90%;
            max-width: 1050px;
            margin: 0 auto;
            padding: 55px 25px;
        }

        .header {
            text-align: center;
            margin-bottom: 38px;
        }

        h1 {
            font-size: 48px;
            margin: 0;
            color: #5a3d2b;
        }

        .cheeky-line {
            margin-top: 12px;
            font-size: 17px;
            color: #e5771e;
            font-style: italic;
        }

        .form-box {
            background-color: #5a3d2b;
            border-radius: 28px;
            padding: 28px;
            box-shadow: 12px 12px 0 #e5771e;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .section {
            background-color: #75c8ae;
            border-radius: 20px;
            padding: 26px;
            border: 3px solid #ffecb4;
        }

        .section-wide {
            grid-column: span 2;
        }

        h2 {
            margin: 0 0 22px;
            font-size: 22px;
            color: #5a3d2b;
            border-bottom: 3px solid #5a3d2b;
            display: inline-block;
            padding-bottom: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            font-weight: bold;
            color: #5a3d2b;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            border: none;
            border-bottom: 3px solid #5a3d2b;
            background-color: transparent;
            padding: 11px 4px;
            font-size: 16px;
            color: #5a3d2b;
            outline: none;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 95px;
            resize: vertical;
            line-height: 1.5;
        }

        input::placeholder,
        textarea::placeholder {
            color: rgba(90, 61, 43, 0.65);
        }

        .button-area {
            grid-column: span 2;
            text-align: center;
            margin-top: 10px;
        }

        button {
            background-color: #f4a127;
            color: #5a3d2b;
            border: 3px solid #ffecb4;
            border-radius: 14px;
            padding: 15px 42px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 6px 6px 0 #75c8ae;
            transition: 0.2s ease;
        }

        button:hover {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 #75c8ae;
        }

        @media (max-width: 800px) {
            h1 {
                font-size: 36px;
            }

            form {
                grid-template-columns: 1fr;
            }

            .section-wide,
            .button-area {
                grid-column: span 1;
            }

            .form-box {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <div class="header">
            <h1>Fill Your Resume Details</h1>
            <p class="cheeky-line">May FAANG find you.</p>
        </div>

        <div class="form-box">
            <form action="/create-portfolio" method="post">

                <section class="section">
                    <h2>Personal Details</h2>

                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" name="name" placeholder="Your full name" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email" placeholder="your.email@example.com" required>
                    </div>
                </section>

                <section class="section">
                    <h2>Experience</h2>

                    <div class="form-group">
                        <label>Work Experience</label>
                        <textarea name="experience" placeholder="Internships, jobs, responsibilities, tools used..." required></textarea>
                    </div>
                </section>

                <section class="section">
                    <h2>Education</h2>

                    <div class="form-group">
                        <label>Education Details</label>
                        <textarea name="education" placeholder="Degree, university, subjects, achievements..." required></textarea>
                    </div>
                </section>

                <section class="section">
                    <h2>Projects</h2>

                    <div class="form-group">
                        <label>Project Details</label>
                        <textarea name="projects" placeholder="Project name, technologies, what you built..." required></textarea>
                    </div>
                </section>

                <div class="button-area">
                    <button type="submit">Create Portfolio</button>
                </div>

            </form>
        </div>
    </main>
</body>
</html>
